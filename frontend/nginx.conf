# Replaces nginx's default server config in the final image (see
# Dockerfile). Reverse-proxies the same path prefixes vite.config.js's
# dev-only proxy covers, so api.js's relative fetch('/tickets') etc. work
# unchanged whether served by `vite dev` or this built/served image.
#
# Assumes the backend container is reachable at the hostname "backend" —
# this must match whatever service name backend gets in docker-compose.yml.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location /tickets {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /pipeline {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /reports {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
